<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Meet + Transcribe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="left">
      <input id="room" placeholder="ID кімнати" />
      <input id="name" placeholder="Ваше ім'я" />
      <select id="model" aria-label="Модель транскрибації">
        <option value="nova-3">Deepgram Nova-3 (макс. якість)</option>
        <option value="nova-2">Deepgram Nova-2 (економніша)</option>
      </select>
      <button id="join">Увійти</button>
      <button id="leave" disabled>Вийти</button>
      <button id="invite">🔗 Поділитися кімнатою</button>
    </div>
    <div class="right">
      <button id="mic" disabled>🎤 Мікрофон вкл</button>
      <button id="cam" disabled>📷 Камера вкл</button>
      <button id="share" disabled>🖥️ Шерити екран</button>
      <button id="download" disabled>⬇️ Завантажити транскрипт</button>
    </div>
  </header>

  <main>
    <section class="videos">
      <div id="remoteVideos" class="remote-grid" aria-live="polite"></div>
      <div class="video-wrapper self">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="label" id="localLabel">Ви</div>
        <div id="localSubs" class="subs"></div>
      </div>
    </section>
    <section class="log">
      <h3>Транскрипт</h3>
      <div id="log"></div>
    </section>
  </main>

  <footer>
    <small>Demo • WebRTC + Deepgram Nova-3/Nova-2 (uk-UA) для транскрибації. Для продакшену додайте TURN.</small>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
